# Netlify configuration for Dyke Rebellion
# Static single-file site — no build step, publish the repo root.

[build]
  publish = "."
  command = ""

# Long cache for static images; HTML stays fresh
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Merch mockups can be pulled into the Shopify admin
[[headers]]
  for = "/merch/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=604800"

# Old GoDaddy parked-page URL Google still remembers
[[redirects]]
  from = "/lander"
  to = "/"
  status = 301
